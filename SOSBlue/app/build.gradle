plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.antor.sosblue'
    compileSdk 36

    defaultConfig {
        applicationId "com.antor.sosblue"
        minSdk 26
        targetSdk 36
        versionCode 256
        versionName "2.5.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ── Fix #1: Explicit ABI filters so native .so libraries are packaged
        //    for every supported architecture.  Without this the build system
        //    may silently omit ABIs, leading to UnsatisfiedLinkError at runtime.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // ── Fix #1: Ensure native libraries are extracted from the APK so that
    //    isolated child-processes (WebView, shell-packer, etc.) can load them.
    //    System.loadLibrary() in an isolated process cannot access un-extracted
    //    compressed .so files inside the APK.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Include f2p-serverless / Wandering Fibre Engine source sets
    sourceSets {
        main {
            java.srcDirs += [
                    '../../f2p-serverless/wandering-fibre-engine/api',
                    '../../f2p-serverless/wandering-fibre-engine/core',
                    '../../f2p-serverless/wandering-fibre-engine/network'
            ]
        }
        test {
            java.srcDirs += [
                    '../../f2p-serverless/wandering-fibre-engine/test'
            ]
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
