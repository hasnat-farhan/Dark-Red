plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.antor.sosblue'
    compileSdk 36

    defaultConfig {
        applicationId "com.antor.sosblue"
        minSdk 26
        targetSdk 36
        versionCode 256
        versionName "2.5.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Include f2p-serverless / Wandering Fibre Engine source sets
    sourceSets {
        main {
            java.srcDirs += [
                    '../../f2p-serverless/wandering-fibre-engine/api',
                    '../../f2p-serverless/wandering-fibre-engine/core',
                    '../../f2p-serverless/wandering-fibre-engine/network'
            ]
        }
        test {
            java.srcDirs += [
                    '../../f2p-serverless/wandering-fibre-engine/test'
            ]
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
